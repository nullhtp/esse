[package]
name = "gpui-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Pinned for the life of the spike — see design.md, D6.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c8e44cfa7bda9b2e22c8d6934d78969352e7f61a" }
# `font-kit` is NOT on by default here, and without it gpui_macos renders no
# text at all (it warns, via `log`, and draws nothing). gpui's own examples
# enable it the same way.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c8e44cfa7bda9b2e22c8d6934d78969352e7f61a", features = ["font-kit"] }
markdown-lite = { path = "../markdown-lite" }
env_logger = "0.11"
